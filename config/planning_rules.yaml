# PLANNING RULES — owner overrides, 2026-09-24.
#
# Where a rule here and client_rules.yaml speak to the same thing, this file wins.
# Everything else in client_rules.yaml stands, and KMBR (kmbr_rules.yaml) is still
# checked on top of the result. Slopes are written rise:run ("1:4" = 1 m of rise in
# 4 m = 25% = 14.04 degrees).
#
# The planning order these rules feed (app/src/engine/pipeline):
#   terrain -> hydrology -> waterlogging + safe zones -> public space -> slope ->
#   non-buildable (> 1:4) -> plotable zones -> roads + road slopes -> plots ->
#   plot slope (<= 1:5) -> cut and fill -> typologies -> FSI + footprints ->
#   placement + spacing -> 3D massing.
# Every decision is generated from the layers before it, never drawn first.
#
# Owner, 25 Sep: the client's zoning plan sets where each use goes. The plan departs
# from it only where the water or the terrain makes it (waterlogging, Rule 22 slope,
# natural drains), and then only to hand that ground to open space.
version: 2026-09-25

# The six master-plan options (owner 25 and 28 Sep): villa category x road orientation.
options:
  # Owner 7 Oct 2026: the plan is drawn on the owner's draft financial model ("Draft model.xlsx"):
  # its programme (config/programme_draft_model.yaml) on the zoning drawn for it
  # (data/processed/zones_draft_model.geojson, tools/zoning/draft_model.py), with the rules under
  # bases.draft_model below. `client` is the client's cashflow V4 on the client's zoning plan.
  basis: draft_model             # draft_model or client
  villa_sizing: A                # client basis: A, B, B_count or C (villas.categories); draft model: MIX
  road_orientation: terrain      # terrain = least cut and fill; north_south = Vastu, primary and secondary N-S
  # Draft model only. model = zones_draft_model.geojson; green_pockets (owner 9 Oct, options D3/D4) =
  # zones_draft_model_pockets.geojson: the dry ground west of the north pond and the west end of the south pond's
  # bank walk are villas, and the same open space is nine pocket gardens among the villas (still 8.3 ac);
  # green_chain (owner 9 Oct, options D5/D6) = zones_draft_model_chain(_ns).geojson: the gardens one continuous
  # chain through the villa blocks, lake to lake, open space on top of the 8.3 ac (at least 300 villas).
  draft_zoning: model
  # Owner 12 Oct (D7): the plan with the least cut, fill and retaining wall. least_earthwork (draft_zoning) =
  # zones_draft_model_d7.geojson (optimise.py D7=1, then greens.py pockets, POCKET_FACTOR 1): the villas off the costliest land.
  # standard (D1-D6) as before; min: the least_earthwork rules below (low garden steps as batters, road cuts and fills
  # onto the parks as banks, the road's own level in its corridor). D7 = draft_zoning least_earthwork + earthwork_mode
  # min + roads.profile_mode least_earthwork, terrain roads.
  earthwork_mode: standard

# Rules that replace the client-basis values on the draft-model basis (dotted path: value).
bases:
  draft_model:
    options.villa_sizing: MIX
    # The draft zones carry their own use and phase: none of the client-plan zoning moves apply.
    zoning.clubhouse_dry_side_to: null
    zoning.senior_zone_to_clubhouse: false
    zoning.phase_land: []
    # Each apartment zone holds its component's flats (programme_draft_model.yaml): towers as many
    # as the flats need, at the floors the airport limit allows. The client-basis tower set is dropped.
    apartments.towers_per_zone: null
    apartments.towers_by_zone: []
    apartments.units_total: null
    apartments.tower_sites: []
    apartments.tower_floors: null
    apartments.tower_flats_per_floor: null
    # The model's construction area is 1.15 x saleable for apartments (Inputs L98): 1 / 1.15 = 0.87.
    apartments.plan_efficiency: 0.87
    # Owner 8 Oct: the roads are not the model's (its 12% + 2 ac): the network the ground and the plan want, cross
    # streets through the villa rows as in the earlier options (roads.cross_street_every_plots), trunk roads free
    # to cross a zone where that is the better line (built zones cost as much to cross as each other; parks more).
    # Cross streets: a block no longer than about 170 m (16 plots of the model's mix), walkable and served from
    # both ends, without the street every 8 plots that cut the rows into wedges on the slopes.
    roads.cross_street_every_plots: 16
    roads.cross_street_min_spacing_m: 120
    # Owner 8 Oct (terrain option, D1): cross streets square to the rows, only where the ground along them is within
    # the secondary limit (1:7); elsewhere the rows link to the network at their ends. North-south (D2) is unchanged.
    roads.cross_street_square_only: true
    roads.zone_interior_cost: {villas: 25, park: 400, apartments: 25, commercial: 2.5, retail: 25, office: 25, hospital: 25, batching: 2.5, senior: 25, school: 25, clubhouse: 25, reserved: 25}
    # Owner's roads: the client's 18 m entry road from the main gate on the Mangalapuram-Pothencode
    # road south to the existing road (zoning plan: "Main gate / commercial strip, 18 m N-S road"),
    # through the retail street; and the south road along the parcel edge (owner 28 Sep).
    # Client 12 Oct: permanent roads. The client's 18 m N-S road runs straight down the zoning plan's commercial strip,
    # from the parcel's north edge to the strip's south end, and on along Project 2's south edge to the loop round
    # Projects 2 and 3 (the road between the two parcels and the existing road up the batching strip, both fixed;
    # its north side along Project 3 is drawn here). The gate arm's road joins the client's road at its top.
    roads.owner_routes:
      - {tier: primary, width_m: 18, why: "the client's 18 m N-S road, straight down the commercial strip (client zoning plan; permanent, client 12 Oct)",
         points: [[287.6, 606], [295.6, 160]]}
      - {tier: primary, why: "the client's road on to the loop round Projects 2 and 3, along Project 2's south edge (client 12 Oct)",
         points: [[295.6, 160], [300, 156], [366, 156]]}
      - {tier: primary, why: "from the main gate on the Mangalapuram-Pothencode road down the gate arm to the client's road",
         points: [[340, 662], [334, 630], [331, 600], [318, 582], [289, 572]]}
      - {tier: primary, why: "the loop's north side, along Project 3 (client 12 Oct)",
         points: [[398, 398], [420, 414], [654, 414]]}
      - {tier: primary, why: "the owner's south road, along the parcel edge",
         points: [[471, 11], [527, 28], [585, 30], [632, 37], [646, 57], [649, 72], [675, 87]]}

zoning:
  source: client                           # data/processed/zones_client_registered.geojson
  # Zone name -> use, first match wins (case-insensitive substring of the zone name).
  uses:
    - {match: "SCHOOL", use: school}
    - {match: "CLUBHOUSE", use: clubhouse}
    - {match: "SENIOR", use: senior}
    - {match: "APARTMENT", use: apartments}
    - {match: "VILLA", use: villas}
    - {match: "COMMERCIAL", use: commercial}
    - {match: "BATCHING", use: batching}
    - {match: "HOSPITAL", use: reserved}   # deferred until the land is acquired: kept, nothing placed
    # DEFAULT pending owner (asked 25 Sep): the client's PHASE 2 and PHASE 3 zones carry no
    # use in the zoning plan. They take villas, the use furthest short of its programme.
    # Owner 25 Sep: the villas are sized on the four villa zones (23.91 ac); PHASE 2 and 3 are
    # future phases and are not planned at this stage.
    - {match: "PHASE", use: future}
  # Owner 25 Sep (revised): the clubhouse zone's dry side, across the existing road, becomes senior
  # living; the client's senior zone, all of it, joins the clubhouse as clubhouse, golf and public space.
  clubhouse_dry_side_to: senior
  senior_zone_to_clubhouse: true
  # Owner 25 Sep: land carved from Phase 2 and 3, in this order. Apartments: the programme's 12 ac
  # less the apartment zone's 5.3 ac = 6.7 ac, 4.0 in Phase 2 and 2.7 in Phase 3, on the lower ground
  # (airport limit). Villas: the programme's 35 ac less the villa zones' 23.91 ac, split equally, by an
  # existing road with the best outlook. What is left of each phase is to be decided with the client.
  phase_land:
    - {zone: "PHASE 2", use: apartments, ac: 4.0, by: low_ground}
    - {zone: "PHASE 3", use: apartments, ac: 2.7, by: low_ground}
    - {zone: "PHASE 2", use: villas, ac: villa_share, by: road_and_view}
    - {zone: "PHASE 3", use: villas, ac: villa_share, by: road_and_view}
  phase_land_access_reach_m: 80            # ASSUMPTION: road access counts fully at the road, nothing past 80 m
  phase_land_weights: {access: 0.6, view: 0.4, low: 0.7}   # ASSUMPTION
  # Land outside every client zone (the gaps the zoning plan leaves for circulation) is
  # where the primary roads prefer to run; what they do not use is open space.

hydrology:
  # The storm itself is config/assumptions.yaml hydrology.design_storm_mm, which
  # is set to this planning basis so the Hydrology panel and the plan agree.
  planning_storm_mm: 300
  # Waterlogging = ground under water at the peak of the planning storm (ponds risen
  # over their rims plus water running in the swales), at least this deep.
  waterlogging_min_depth_m: 0.05
  # Extra margin kept between waterlogged ground and building land. 0 = none set;
  # the owner has not asked for a freeboard strip.
  building_offset_from_waterlogging_m: 0
  # Owner, 25 Sep: small fragments of waterlogging are ignored so the land round them
  # joins into one usable piece; the high ground above takes the water to the drains.
  # Patches smaller than this are ignored (was 20 m2, puddles only).
  min_waterlogging_patch_m2: 1000
  # Owner 12 Oct (optimised zoning): water is kept to three lakes, the north pond, the south pond and the west lake
  # in the low ground west of the 18 m road; the other waterlogged patches (the corners, the east lobe, the one under
  # the 18 m road) are drained and built on, and the lakes are dug deeper to hold their water at the 300 mm peak.
  # A lake is the waterlogged patch at, or within 20 m of, its point (local metres).
  keep_lakes: [[491, 477], [552, 44], [252, 255]]
  # ASSUMPTION (owner 25 Sep direction): water running in a channel narrower than this
  # is carried by the storm-water drains, not left as a waterlogged strip. 0 = off.
  # The surveyed natural drains (Rule 22(4)) are kept clear regardless.
  ignore_channels_narrower_than_m: 6

public_space:
  may_overlap_waterlogging: true         # landscape, recreation, ecological infrastructure
  includes_non_buildable_slope: true
  includes_natural_drains: true          # Rule 22(4): kept unobstructed

open_space:
  # Owner 12 Oct: the green by kind. A park this big or bigger is RC, the large public open space; a smaller one is
  # landscape (with the strips no zone took and the grounds round the buildings). 0.25 ac. ASSUMPTION (owner to confirm).
  rc_min_m2: 1000

slope:
  # Non-buildable ground is KMBR Rule 22(3) (2025 amendment): no development on a slope over
  # 45 degrees (kmbr_rules.yaml rule22_site_suitability.no_building_slope_deg_over), on land
  # liable to be flooded, and (22(4)) nothing may obstruct a natural drain or stream.
  non_buildable: kmbr_rule22
  # Owner's stricter "steeper than 1:4" limit, SUSPENDED 2026-09-24 in favour of Rule 22.
  # Set non_buildable to "1:4" to bring it back.
  suspended_non_buildable_steeper_than: "1:4"
  # Owner, 25 Sep: specks of a few tens of cells over 45 degrees are mesh noise, not
  # slopes; they are ignored (buildable, taken by plot cut and fill). Larger faces count.
  min_non_buildable_patch_m2: 200
  plot_max: "1:5"                          # per plot, after cut and fill

roads:
  existing: fixed                          # built roads: kept exactly, checked against the limits below and reported
  existing_tier: primary                   # the built roads are checked against the primary limit
  max_gradient: {primary: "1:8", secondary: "1:7", tertiary: "1:6"}   # replaces client/assumptions road_gradient
  # How a road's vertical profile is set within those limits (route.ts). grade_limited: the line nearest the ground,
  # a forward then a backward pass (D1-D6). least_earthwork (D7): the line within the limit that costs least in cut,
  # fill and verge walls, at the assumptions.yaml earthwork_costs rates (exact dynamic programme over the stations).
  profile_mode: grade_limited
  # DEFAULT pending owner (asked 2026-09-24): primary = client public width, secondary = KMBR
  # through-street width, tertiary = client internal width. The client's strictly north-south
  # 18 m spine is not used: a straight N-S line cannot keep within 1:8 on this terrain.
  width_m: {primary: 10, secondary: 7, tertiary: 6}
  routing:
    # Per metre of road: plotable land 1. Crossing these costs more, so roads go round them
    # where they reasonably can. Rule 22 slope is impassable.
    cost: {public_space: 1.5, waterlogging: 12, natural_drain: 40, existing_road: 0.4}
    # Penalty per metre for a step at twice the gradient limit (grows with the square of the excess).
    over_grade_penalty: 60
  # Villa streets run along the contours; secondary cross streets run up the slope every
  # this many plots (ASSUMPTION), which sets the block length.
  cross_street_every_plots: 8
  # ASSUMPTION: a cross street whose grading to 1:7 would move more than this (m3 per metre of
  # street) is left out and its blocks merge; 30 m3/m is a 7 m road in about 4 m of cut.
  cross_street_max_earthwork_m3_per_m: 30
  cross_street_min_spacing_m: 60          # ASSUMPTION: small plots do not bring cross streets closer than this
  north_south:                             # Vastu option (owner 25 Sep)
    tolerance_deg: 10                      # primary and secondary within 10 degrees of north-south
    step_weights: {across: 4, diagonal: 20}    # routing: an east-west step costs 4, a diagonal 20, against 1 north-south: a cardinal grid
  # A villa street with fewer plots than this, serving nothing else, is taken out and its
  # land given to green (owner 25 Sep: no roads to nowhere).
  min_plots_per_street: 2
  # Routing through a zone: along its edge costs 1 a metre, through its middle this much,
  # so primaries follow the gaps and edges the zoning plan leaves. ASSUMPTION.
  zone_interior_cost: {villas: 2.5, apartments: 2.5, commercial: 2.5, batching: 2.5, senior: 25, school: 25, clubhouse: 25, reserved: 25}
  zone_edge_band_m: 10                     # ASSUMPTION: what counts as the edge of a zone
  outside_zones_cost: 0.8                  # the zoning plan's own gaps between zones
  # Owner 28 Sep (sketch): roads drawn by the owner, laid before any road is routed, in local metres.
  # The south primary keeps to the parcel's south edge (5-6 m in) instead of crossing the Phase 3
  # apartment zone, so the zone stays whole and its tower fits.
  owner_routes:
    - {tier: primary, why: "the owner's south road, along the parcel edge clear of the Phase 3 apartment zone",
       points: [[471, 11], [527, 28], [585, 30], [632, 37], [646, 57], [649, 72], [675, 87]]}
  # A buildable piece of a zone at least this big gets its own primary road; smaller pieces
  # are reached by the villa streets or become green. ASSUMPTION.
  primary_serves_pieces_over_m2: 2000

plotable:
  # A plotable zone must fit the smallest plot: nothing narrower than this survives.
  min_width_m: 9.6                         # the smallest plot's short side: 1,500 sq ft (category B) at villas.house.shape_depth_per_width
  min_area_m2: 139                         # = the smallest villa plot (1,500 sq ft, category B)

# Owner 28 Sep: the villas, re-based on the client's cashflow (Outflow C9/C17, E9/E17). Replaces the
# client's 50/30/20 land split and the 25 Sep plot rules (2,500-3,000 + 2,000-2,500 sq ft, FSI 1.0).
villas:
  # Owner 12 Oct (optimised zoning): villas as the land holds, never more than max_per_acre on a villa zone's land;
  # the count each zoning aims for (D1/D2 350-370; the green options may go lower, but not below 300, owner 9 Oct).
  max_per_acre: 15
  # Owner 12 Oct (Vastu): no villa's entrance on the south. The bearings (from north, clockwise) a plot may not face:
  # north-south roads (D2, D4, D6) not south-east, south or south-west; roads to the ground (D1, D3, D5) not south or
  # south-west (south-east is fine there, the grid's angle is the one with the least cut and fill).
  facing_forbidden_deg: {north_south: [112.5, 247.5], terrain: [157.5, 247.5]}
  # (owner 12 Oct, later: villas on the land the towers give up; the count up to 420, 15 an acre still the limit)
  count_by_zoning: {model: [350, 420], green_pockets: [300, 420], green_chain: [300, 420], least_earthwork: [300, 420]}
  # Villa land is 80% plots and 20% roads, with 5% leeway either way; the open space comes from the
  # water and the slope, not from the villa land. Reported against each plan, not forced.
  land_split: {plots: 0.80, roads: 0.20, tolerance: 0.05}
  # Gross FSI on the villa land held at the client's: E17 / D17 = 1,280,000 / 1,393,981 sq ft.
  gross_fsi: 0.918
  # 700 villas on 35 ac in the cashflow (Outflow B9 + B17, C9 + C17) = 20 an acre of villa land.
  count_basis: {programme_units: 700, programme_land_ac: 35}
  # Three ways to size the villas, each with two road layouts (options A1-C2). A type has a plot
  # range the terrain may use and a BUA that stays fixed whatever the plot within the range, so a
  # smaller plot has a higher net FSI and the gross stays the same. BUA = 1.15 x the range's top.
  categories:
    A:   # as many villas as the gross FSI allows at the BUA cap (owner: never over 3,000 sq ft)
      types: [{name: standard, plot_sft: [2250, 2600], bua_sft: 3000}]
    B:   # exactly the client's: 700 villas at 20 an acre; only the road layout changes
      count: true
      types: [{name: standard, plot_sft: [1500, 1750], bua_sft: 2000}]
      # Package 1's 60 villas at 1,750 sq ft (Outflow B9, E9), read as the zoning plan's Project 1.
      package_1: {zone: "PROJECT - 1", units: 60, bua_sft: 1750}
    B_count:   # options B3/B4 (owner 28 Sep): the earlier 700-plot layouts, on the new house rules
      count: true
      # The plot is the largest that still fits the client's 700: searched over this range. Its floor
      # is the smallest plot a full G+2 at 65% ground coverage can hold 2,000 sq ft on: 2,000 / 1.95.
      types: [{name: standard, plot_sft: [1030, 1750], bua_sft: 2000}]
      package_1: {zone: "PROJECT - 1", units: 60, bua_sft: 1750}
      # The earlier count plots' shape: up to 18 m deep, at most 1:2.5, at least 6 m wide.
      shape: {max_depth_m: 18, depth_per_width: 2.5, min_width_m: 6}
      # The owner's 1.5 m setbacks are set aside for these small plots: KMBR Table 4's yards govern
      # (the small-plot row up to 125 m2 of plot and 200 m2 of BUA; the ordinary row above).
      house: {yards: kmbr, small_plot_row: small_plot_A1_F_bua_le200_plot_le125, small_plot_max_m2: 125, small_bua_max_m2: 200}
    C:   # two types, placed plot by plot on terrain and sales, no fixed share (owner 28 Sep)
      types:
        - {name: standard, plot_sft: [1750, 2000], bua_sft: 2300}
        - {name: premium, plot_sft: [2000, 2250], bua_sft: 2600}
      # ASSUMPTION: premium in the client's premium zone, or where at least half the ground within
      # 250 m lies 5 m or more below the plot (an open outlook).
      premium_when: {zones: ["PREMIUM"], outlook_min: 0.5}
    MIX:   # draft-model basis (owner 7 Oct): the model's four plot types in its mix, a set count per zone
      # Types, shares, plots and villa sizes from programme_draft_model.yaml villa_types (Inputs rows
      # 130-133); each villa zone's count is its component's units (Inputs column H). Plots are the
      # model's sizes, not ranges; each next plot takes the type furthest behind its share.
      types_from_programme: true
      count: true
      types: []
      # ASSUMPTION: every plot 20 m deep (widths 7.8-12.1 m for the 1,800-2,800 sq ft types, all within
      # 1:2.5), so the street pattern is 6 m of street to 40 m of plots: 87% of a block sold.
      plot_depth_m: 20
      # ASSUMPTION (owner 7 Oct: 85% of the villa land in plots): after every plot of the model's sizes is
      # laid, an end or edge plot takes in the land left beside or behind it, up to 2 x its type's area.
      max_plot_growth: 2.0
      # Owner 8 Oct (the hospital's lobe and the pond park become villas): the villa land is filled, every
      # villa the ground holds is laid; the phases report against the model's counts (48 / 80 / 96 / 96).
      fill: true
  # Plots are cut at one point in their type's range, searched from the largest down until the
  # category's target (count or gross FSI) is met.
  sizing_steps: 6
  # Owner 28 Sep sketch: the house on its plot.
  house:
    ground_coverage_max: 0.65              # owner: ground floor 0.65 of the plot (= KMBR Table 6 A1 coverage)
    first_floor_share: 0.50                # owner's target; a bigger first floor grows toward the road
    rear_m: 1.5                            # owner: fixed
    side_min_m: 1.5                        # owner: at least; wider is fine
    # The rest of the plot, in front, is garden: at least KMBR Table 4's front yard for the row below.
    front_yard_row: A1_A2_any__F_upto200
    # ASSUMPTION: the plot shape with the most ground floor inside those yards:
    # depth / width = (front 3.0 + rear 1.5) / (2 x side 1.5).
    shape_depth_per_width: 1.5
    # Plots cut to fit a pocket (row ends, corners, zone edges) flex in width and depth within their
    # type's range. ASSUMPTION: the house stays at least this wide and deep, and the plot no longer
    # than this many times its width (client_rules villa_plots.aspect_ratio.max).
    min_house_side_m: 4.5
    max_plot_aspect: 2.5
    # Owner 28 Sep (option a): what G+1 cannot hold goes into a room on the roof, set to the back; it
    # may grow to a full second floor (G+2), as on the B3/B4 plots.
    roof_room: true
  floor_height_m: 3.0                      # ASSUMPTION, as assumptions.yaml floor_to_floor_m.apartments

senior_living:                             # replaces client "senior = villa-style plots"
  min_floors: 4                            # G+3 minimum
  max_floors: 6                            # ASSUMPTION (draft model): where a zone fits too few G+3 blocks, they may rise to G+5
  min_clear_between_buildings_m: 12
  # Units and unit size come from programme.yaml (use: senior). DEFAULTS pending owner:
  units_per_floor: 6
  plan_efficiency: 0.8                     # plinth share of the floor plate (client_rules apartments.flats_share_of_footprint)
  plate_aspect: 2.0                        # long side : short side, long side along the contours
  setback_m: 3.0                           # KMBR Table 4 front average for A1/A2; yards above 10 m to be checked
  floor_height_m: 3.0
  method: "units -> floors -> units per floor -> floor plate -> footprint -> placement"

apartments:
  fsi_max: 4.0                             # owner 25 Sep: 3.0 was tentative; 4.0 is acceptable (KMBR A1 with the Rs 5,000/m2 fee)
  # Units and unit size come from programme.yaml (use: apartments). DEFAULTS pending owner:
  flats_per_floor: 4                       # client_rules apartments.flats_per_floor.min
  max_floors: 20                           # client_rules apartments.max_floors
  plan_efficiency: 0.8
  plate_aspect: 2.0
  min_clear_between_buildings_m: 12        # client_rules apartments.spacing.min_clear_m
  # Owner 25 Sep: the 16,500 sq ft tower footprint is the whole building on the ground, so no podium
  # margin beyond it; yard at the KMBR ground minimum (height-driven yards to be checked).
  setback_m: 3.0                           # was 6.0 (client_rules joined_block_inside)
  podium_margin_m: 0                       # was 6.0
  # Owner 25 Sep: no tower stacked behind another. A tower may not stand in front of or
  # behind another (overlapping it along the contours) within this distance up or down
  # the slope, so every tower keeps its view out. ASSUMPTION.
  view_clear_depth_m: 100
  # ASSUMPTION: within that depth towers are staggered; one may overlap another along the
  # contours by at most this share of its length, so the view passes between them.
  view_max_overlap_share: 0.34
  min_floors: 6                            # ASSUMPTION: under this the airport limit leaves too little to build
  # Owner 25 Sep: six towers, three in the apartment zone and three on the clubhouse zone's dry
  # side; footprint as proposed by the owner. Floors from FSI, shared equally in each zone.
  towers_per_zone: 3
  # Owner 25 Sep (revised): six towers across three places, 1,000 flats shared equally between them.
  towers_by_zone:
    - {match: "APARTMENTS &", towers: 3}   # the client's apartment zone, 5.3 ac in the site
    - {match: "PHASE 2", towers: 2}        # 4.0 ac carved from Phase 2
    - {match: "PHASE 3", towers: 1}        # 2.7 ac carved from Phase 3
  units_total: 1000
  # Owner 25 Sep: each tower is a 16,500 sq ft block of 20 floors with 10 flats a floor (owner's
  # calculation); the airport line can still hold a tower on high ground lower.
  # Owner 25 Sep: villas sell on their views; where a zone leaves a choice, towers keep out of them.
  # From first-floor lookouts every 10 m over the villa land, a direction has a view when ground at
  # least drop_m below is seen over the terrain within reach_m. A tower's cost: metres of spread given
  # up per 1% of all the villas' view it hides. ASSUMPTION (weight).
  villa_views: {eye_m: 4.5, drop_m: 5, reach_m: 300, weight_m_per_pct: 60}
  # Owner 25 Sep (sketch): tower sites, local metres; the zone's towers take them in order, each on
  # the nearest ground that takes it. Both Phase 2 towers at the west end of the phase's apartment
  # land, together, clear of the Phase 2 villas' outlook to the south.
  tower_sites:
    - {match: "PHASE 2", at: [434, 145]}
    - {match: "PHASE 2", at: [403, 86], take_unzoned_m: 40}   # the other below it, across the zone's edge;
      # the unzoned buildable ground within 40 m joins the apartment land (owner's sketch). The middle site is dropped.
  tower_floors: 20
  tower_flats_per_floor: 10
  tower_footprint_sft: 16500
  floor_height_m: 3.0                      # assumptions.yaml floor_to_floor_m.apartments
  terrain_response: podium                 # podium height follows the ground; no forced flat platform
  method: "FSI -> built-up area -> floors -> floor plate -> footprint -> podium -> terrain response"

# Airport height limit. KMBR Rule 24(2): a building near an airport is limited by the AAI
# colour-coded zoning map, measured to its highest point with no exemptions.
airport:
  # AAI CCZM Thiruvananthapuram (DRG AAI/16A-CCZM(GRID)/THIRUVANANTHAPURAM/2016, draft v1.0):
  # the site is in grid C9, 16.8 km from the ARP: permissible top elevation 140 m AMSL.
  # An AAI NOC is still needed (KMBR Rule 5 table, item 14: within 20 km of the ARP).
  permissible_top_amsl_m: 140
  # ESTIMATE, not surveyed: the TBM is an assumed RL 100 with no MSL value (DECISIONS 17 Sep).
  # SRTM 30 m heights at 100 points on the site sit a median 29.4 m below the survey RLs
  # (interquartile 27.2-31.5 m, correlation 0.98), so RL 100 is about 70.6 m AMSL, +/- 10 m.
  # Replace with the surveyor's MSL value when it comes.
  tbm_amsl_m: 70.6
  tbm_rl: 100
  rooftop_allowance_m: 6                   # ASSUMPTION: lift machine room, tank and parapet above the top floor

school:
  land_ac_from: core_campus                # programme.yaml school land_ac.core_campus
  max_mean_grade: "1:8"                    # a campus wants gentle ground
clubhouse:
  building_land_ac: 1.0                    # programme clubhouse_annex land
  max_floors: 3                            # ASSUMPTION (was 2 in code): the clubhouse keeps the smaller west side
  # Owner 25 Sep: the flooded land is open space, and part of it can be the golf course,
  # which belongs to the clubhouse; golf cannot go on steep land.
  golf:
    max_grade: "1:8"                       # ASSUMPTION: gentle ground only for play
    reach_from_zone_m: 50                  # ASSUMPTION: open space this close to the clubhouse zone can be golf
    min_patch_m2: 1000                     # ASSUMPTION: a playable piece, not a verge

commercial:                                # the client's COMMERCIAL & CONVENTION CENTRE zone
  occupancy: F_commercial
  max_floors: 10                           # ASSUMPTION
  max_wing_plate_m2: 2500                  # ASSUMPTION
  setback_m: 3.0                           # KMBR Table 4 front average; height-driven yards to be checked
  convention_floor_height_m: 8             # ASSUMPTION: one hall-height floor for the programme's convention hall

# Draft model (owner 7 Oct): the hospital, retail street and office as blocks to their construction
# area (programme_draft_model.yaml), coverage from KMBR Table 6 for the occupancy. ASSUMPTIONS: the
# most floors each may take, and floor heights.
blocks:
  hospital: {occupancy: C_hospital, max_floors: 8, floor_height_m: 4.0}
  # A high street: long blocks along the entry road in the gate arm, up to G+4 (ASSUMPTION: wing size, shapes, floors).
  retail: {occupancy: F_commercial, max_floors: 5, floor_height_m: 4.5, wing_max_m2: 900, aspects: [4, 3, 2], wing_gap_m: 6}
  office: {occupancy: E_office, max_floors: 12, floor_height_m: 3.6}

batching_plant:                            # the client's BATCHING PLANT zone: a temporary works yard
  plant_footprint_m: [30, 20]              # ASSUMPTION: mixer, silos and aggregate bins
  height_m: 18                             # ASSUMPTION: silo height

amenities:                                 # school and clubhouse buildings
  max_wing_plate_m2: 1200                  # ASSUMPTION: a big programme is built as wings no larger than this a floor
  min_clear_between_wings_m: 12            # ASSUMPTION: as the senior and apartment spacing
  plate_aspects: [2, 1.5, 1, 3]            # ASSUMPTION: wing shapes tried, long side : short side, first that fits
  setback_m: 3.0                           # KMBR Table 4 front average; height-driven yards to be checked

# Owner 12 Oct (D7, options.earthwork_mode min): a plot's fall taken by its house, not by retaining walls. The plot is
# graded in bands, each at most slope.plot_max: the front garden, the house in levels, the rear yard; the steps
# between them fall on the house's walls (its plinth, priced as RCC: assumptions earthwork_costs.plinth_rs_per_m3).
least_earthwork:
  # Measured on D3 (12 Oct): the bands cost more than one plane a plot (the step under the house is no smaller than the
  # wall it replaces, and the bands add steps): off by default; D7 grades a plot as one plane, as D1-D6.
  terraced_plots: false
  # A step between two gardens, or a garden and the green, up to this, away from the houses: a planted earth batter
  # (1:1.5) in the yards, not an RCC wall (assumptions earthwork_costs.batter_rs_per_m_per_m_height). 0: none.
  batter_max_step_m: 1.0
  # A road's cut or fill against a park or unzoned land, with room for it clear of every plot and building: a bank, not a wall.
  road_banks_on_green: true
  # Owner to decide (12 Oct): the plots' platforms held to this instead of slope.plot_max (1:5), e.g. "1:4"; null: 1:5.
  plot_max: null
  # Tried on D3 and D7 (12 Oct): each plot's plane through its street's level at the gate: twice the earth. Off.
  plot_front_at_road_level: false
  # Inside a road's corridor the road's own level stands, not a plot platform's larger cut or fill beside it.
  road_level_wins: true
  garden_at_road_level: true       # the garden starts at the road's finished level at the gate (no wall along the road)
  house_levels_max: 2              # a split-level house: two floor levels a storey (ASSUMPTION)
  house_level_min_depth_m: 4       # each level at least this deep (ASSUMPTION)
