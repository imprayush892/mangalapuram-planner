run: '2026-10-12'
inputs_changed: Inputs C16 (gross land), G97-G116 (each component's land), C33, C35 (roads), C37 (open space), C41 (villa plot efficiency), D123-D126
  (villa land by phase), H99, H106-H108 (villas by phase), D130-D133 (villa mix); row 103 (the hospital's, out of the plan) as the office's Phase
  1 (40%), row 115 as its Phase 3 (60%)
limitations:
- 'Retail: the model has one retail row (tied to its Retail Lease sheet), so all the retail runs as Phase 3; the 40% the plan builds in Phase
  1 is not timed earlier in the model.'
- 'Office: the Phase 1 and Phase 3 timing (start quarters 3 and 10, sold over 6 and 8 quarters) is an assumption.'
